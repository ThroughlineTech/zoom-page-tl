<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --btn: #f3f4f6;
    --btn-hover: #e5e7eb;
    --accent: #2563eb;
    --accent-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1f23;
      --fg: #e8e8ea;
      --muted: #9aa0a6;
      --line: #34343a;
      --btn: #2c2c31;
      --btn-hover: #3a3a41;
      --accent: #3b82f6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 248px;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    user-select: none;
  }
  .host {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stepper {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
  }
  .pct {
    flex: 1;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  /* The percent doubles as an exact-entry field: click to type a value. */
  input.pct {
    font-family: inherit;
    border: none;
    background: transparent;
    color: var(--fg);
    padding: 2px 0;
    width: 0;
    min-width: 0;
    border-radius: 6px;
  }
  input.pct:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  input.pct:disabled { color: var(--muted); }
  /* Live zoom slider. Log-scaled track; soft detents at the normal numbers. */
  .slider { padding: 12px 12px 2px; }
  .track { position: relative; padding-bottom: 16px; }
  #slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 16px;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  #slider::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: var(--line);
  }
  #slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -5px; /* center the thumb on the 4px track */
    border-radius: 50%;
    background: var(--accent);
    border: none;
  }
  #slider:focus-visible { outline: none; }
  #slider:focus-visible::-webkit-slider-thumb {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  #slider:disabled { cursor: default; }
  #slider:disabled::-webkit-slider-thumb { background: var(--muted); }
  /* Tick strip, inset by the thumb radius so ticks line up with thumb centers. */
  .ticks {
    position: absolute;
    left: 7px;
    right: 7px;
    top: 15px;
    height: 16px;
    pointer-events: none;
  }
  .tick {
    position: absolute;
    top: 0;
    width: 1px;
    height: 5px;
    background: var(--line);
    transform: translateX(-0.5px);
  }
  .tick.major { height: 7px; background: var(--muted); }
  .ticklbl {
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  button {
    font: inherit;
    color: var(--fg);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: translateY(0.5px); }
  .rnd {
    width: 38px;
    height: 38px;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 0 12px 8px;
  }
  .presets button {
    padding: 6px 0;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .presets button.on {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  .actions {
    display: flex;
    gap: 6px;
    padding: 0 12px 8px;
  }
  .actions button {
    flex: 1;
    padding: 8px 0;
    font-size: 12px;
  }
  /* Auto-fit mode active (the Fit width button re-fits on each load). */
  .actions button.on {
    background: var(--accent);
    color: var(--accent-fg);
    border-color: var(--accent);
  }
  .note {
    min-height: 13px;
    padding: 0 12px 6px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
  }
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--line);
    padding: 8px 12px;
  }
  .footer a {
    color: var(--muted);
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .footer a:hover { color: var(--fg); text-decoration: underline; }
  .toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .toggle input { margin: 0; cursor: pointer; }
  .appbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
  }
  .appname { font-size: 12px; font-weight: 600; }
  .power {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .power input { margin: 0; cursor: pointer; }
  /* Suppressed (excluded or paused): dim the (now inert) zoom controls. */
  body.off .slider,
  body.off .stepper,
  body.off .presets,
  body.off .actions { opacity: 0.4; }
  /* Auto mode on: the zoom is auto-managed, so dim the manual numbers (the
     Fit/Auto/Reset buttons stay usable). */
  body.auto .slider,
  body.auto .stepper,
  body.auto .presets { opacity: 0.4; }
  /* Off everywhere (master switch): dim the whole per-site UI, not the appbar. */
  body.globaloff .host,
  body.globaloff .footer { opacity: 0.4; }
  button:disabled { cursor: default; }
  button:disabled:hover { background: var(--btn); }
</style>
</head>
<body>
  <div class="appbar">
    <span class="appname">Zoom Page TL</span>
    <label class="power" title="Turn Zoom Page TL on or off everywhere">
      <input type="checkbox" id="power" checked /><span id="powerLabel">On</span>
    </label>
  </div>

  <div class="host" id="host">…</div>

  <div class="slider">
    <div class="track">
      <input
        type="range"
        id="slider"
        min="0"
        max="1000"
        step="1"
        title="Drag to zoom live. Arrows: +/-1%. Ctrl/Shift+wheel: step."
      />
      <div class="ticks" id="ticks"></div>
    </div>
  </div>

  <div class="stepper">
    <button class="rnd" id="out" title="Zoom out">&minus;</button>
    <input
      class="pct"
      id="pct"
      type="text"
      inputmode="numeric"
      value="100%"
      title="Click to type an exact zoom %"
    />
    <button class="rnd" id="in" title="Zoom in">+</button>
  </div>

  <div class="presets" id="presets"></div>

  <div class="actions">
    <button id="fit" title="Fit the zoom to the window width, once">Fit</button>
    <button id="auto" title="Auto-fit this site on every page load">Auto</button>
    <button id="reset" title="Reset to 100%">Reset</button>
  </div>

  <div class="note" id="note"></div>

  <div class="footer">
    <label class="toggle" title="Pause zooming on this site for now (resume later)">
      <input type="checkbox" id="pause" />Pause
    </label>
    <label class="toggle" title="Never zoom this site">
      <input type="checkbox" id="exclude" />Exclude
    </label>
    <a id="options">Options</a>
  </div>

  <script src="zoom.js"></script>
  <script src="popup.js"></script>
</body>
</html>
